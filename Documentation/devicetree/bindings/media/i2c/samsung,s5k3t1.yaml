%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/samsung,s5k3t1.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Samsung S5K3T1 Image Sensor

maintainers:
  - Gianluca Boiano <morf3089@gmail.com>

description:
  Samsung S5K3T1 (ISOCELL 3T1) is a 20 MP (5184x3880) image sensor with 0.9 um
  pixels. The sensor is controlled over a serial camera control bus protocol
  and sends RAW10 image data over a 4-lane MIPI D-PHY CSI-2 interface.

allOf:
  - $ref: /schemas/media/video-interface-devices.yaml#

properties:
  compatible:
    const: samsung,s5k3t1

  reg:
    maxItems: 1

  clocks:
    description:
      Input clock (EXTCLK).
    maxItems: 1

  reset-gpios:
    description: Active low GPIO connected to the RESET pad of the sensor.
    maxItems: 1

  vana-supply:
    description: Analog power supply (2.8 V).

  vdig-supply:
    description: Digital core power supply.

  vio-supply:
    description: Digital I/O power supply (1.8 V).

  port:
    $ref: /schemas/graph.yaml#/$defs/port-base
    additionalProperties: false

    properties:
      endpoint:
        $ref: /schemas/media/video-interfaces.yaml#
        unevaluatedProperties: false

        properties:
          data-lanes:
            items:
              - const: 1
              - const: 2
              - const: 3
              - const: 4

          link-frequencies:
            items:
              - const: 300000000

        required:
          - data-lanes
          - link-frequencies

required:
  - compatible
  - reg
  - clocks
  - vana-supply
  - vdig-supply
  - vio-supply
  - port

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        camera@2d {
            compatible = "samsung,s5k3t1";
            reg = <0x2d>;

            clocks = <&camera_mclk 0>;
            assigned-clocks = <&camera_mclk 0>;
            assigned-clock-rates = <24000000>;

            reset-gpios = <&tlmm 47 GPIO_ACTIVE_LOW>;

            vana-supply = <&vreg_2p8>;
            vdig-supply = <&vreg_1p2>;
            vio-supply = <&vreg_1p8>;

            orientation = <0>;
            rotation = <270>;

            port {
                endpoint {
                    data-lanes = <1 2 3 4>;
                    link-frequencies = /bits/ 64 <300000000>;
                    remote-endpoint = <&csiphy_ep>;
                };
            };
        };
    };
...
